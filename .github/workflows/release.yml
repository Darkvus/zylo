name: Release

# Runs after a merge to main (and when the auto-merge job asks for it). It builds a release only if the
# version in pyproject.toml has not been released yet, so re-running it is harmless.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      released: ${{ steps.v.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"; echo "v$version is already released"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"; echo "v$version will be released"
          fi

  binary:
    name: binary (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x86_64, suffix: "" }
          - { os: macos-latest, target: macos-arm64, suffix: "" }
          - { os: windows-latest, target: windows-x86_64, suffix: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install pyinstaller .
          pyinstaller --onefile --name zylo --paths . --collect-data zylo --specpath build packaging/zylo_entry.py
      - name: Smoke test
        run: ./dist/zylo${{ matrix.suffix }} --version
      - name: Name the artifact
        shell: bash
        run: mv "dist/zylo${{ matrix.suffix }}" "zylo-${{ matrix.target }}${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: zylo-${{ matrix.target }}
          path: zylo-${{ matrix.target }}${{ matrix.suffix }}

  windows-installer:
    name: windows installer
    needs: [version, binary]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zylo-windows-x86_64
          path: dist
      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          Move-Item dist\zylo-windows-x86_64.exe dist\zylo.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DVersion=${{ needs.version.outputs.version }}" packaging\windows\zylo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: zylo-windows-installer
          path: dist/zylo-setup-x86_64.exe

  python-package:
    name: wheel and sdist
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: zylo-python-package
          path: dist/*

  publish:
    name: publish the release
    needs: [version, binary, windows-installer, python-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ needs.version.outputs.version }}"
          gh release create "$v" artifacts/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Zylo ${{ needs.version.outputs.version }}" --generate-notes
