[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zylo"
version = "0.3.0"
description = "Lenguaje Python-like que transpila a Rust"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
zylo = "zylo.cli:main"

[tool.setuptools]
packages = ["zylo"]
