[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumo"
version = "0.0.1"
description = "Lenguaje Python-like que transpila a Rust"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lumo = "lumo.cli:main"

[tool.setuptools]
packages = ["lumo"]
